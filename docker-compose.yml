# Environnement de développement : PostgreSQL et Mailpit (capture locale des e-mails).
# Pour la production, voir infra/docker/docker-compose.prod.yml et docs/deployment.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: opentask
      POSTGRES_PASSWORD: opentask
      POSTGRES_DB: opentask
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opentask -d opentask']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # Interface web : http://localhost:8025

volumes:
  postgres-data:
