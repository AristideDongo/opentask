name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opentask
          POSTGRES_PASSWORD: opentask
          POSTGRES_DB: opentask_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opentask" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://opentask:opentask@localhost:5432/opentask_test
      E2E_DATABASE_URL: postgresql://opentask:opentask@localhost:5432/opentask_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Contrats OpenAPI à jour
        run: pnpm openapi && git diff --exit-code docs/api/openapi.json
      - run: pnpm test
      - run: pnpm build

      - name: Base E2E
        run: PGPASSWORD=opentask psql -h localhost -U opentask -d opentask_test -c 'CREATE DATABASE opentask_e2e'
      - run: pnpm --filter @opentask/web exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level high

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f infra/docker/api.Dockerfile -t opentask-api:ci .
      - run: docker build -f infra/docker/web.Dockerfile -t opentask-web:ci .
      - name: Moteur de migration présent dans l’image (sans réseau)
        run: docker run --rm --network none --entrypoint sh opentask-api:ci -c 'cd database && node_modules/.bin/prisma version'
