# Exemple de déploiement de production. Voir docs/deployment/installation.md.
#
#   cp infra/docker/.env.prod.example infra/docker/.env.prod   # puis éditez les valeurs
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env.prod up -d --build
#
# Avec HTTPS automatique (Caddy + Let’s Encrypt) : ajoutez `--profile https` et définissez DOMAIN.
name: opentask-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opentask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
      POSTGRES_DB: ${POSTGRES_DB:-opentask}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    image: opentask-api:${OPENTASK_VERSION:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL est requis}
      DATABASE_URL: postgresql://${POSTGRES_USER:-opentask}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-opentask}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET est requis}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-OpenTask <no-reply@localhost>}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_ENABLED: 'true'
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        SOURCE_URL: ${SOURCE_URL:-}
    image: opentask-web:${OPENTASK_VERSION:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080'

  caddy:
    image: caddy:2.10-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on: [web]
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
